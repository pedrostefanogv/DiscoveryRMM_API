name: CI

on:
  push:
    branches:
      - dev
      - main
      - beta
      - lts
      - release
  pull_request:
    branches:
      - dev
      - main
      - beta
      - lts
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Unit, E2E, PostgreSQL Integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution and E2E tests
        run: |
          dotnet restore Discovery.slnx --nologo
          dotnet restore tests/e2e/Discovery.E2E.Tests.csproj --nologo

      - name: Build solution and E2E tests
        run: |
          dotnet build Discovery.slnx -c Release --no-restore --nologo
          dotnet build tests/e2e/Discovery.E2E.Tests.csproj -c Release --no-restore --nologo

      - name: Unit tests (Discovery.Tests)
        run: dotnet test src/Discovery.Tests/Discovery.Tests.csproj -c Release --no-build --nologo --verbosity normal

      - name: E2E tests (Discovery.E2E.Tests)
        run: dotnet test tests/e2e/Discovery.E2E.Tests.csproj -c Release --no-build --nologo --verbosity normal

      - name: PostgreSQL integration tests (Discovery.IntegrationTests)
        env:
          DISCOVERY_INTEGRATION_REQUIRE_DOCKER: 'true'
        run: dotnet test src/Discovery.IntegrationTests/Discovery.IntegrationTests.csproj -c Release --no-build --nologo --verbosity normal
