// Reinicia o Discovery API quando o runtime .NET (ou outra dependencia nativa) e
// atualizado sob o processo em execucao.
//
// Incidente 2026-11-02: "apt upgrade" automatico trocou dotnet-runtime-10.0 de
// 10.0.13 para 10.0.14 as 09:04, enquanto o discovery-api rodava desde 09:02. O
// diretorio .../shared/Microsoft.NETCore.App/10.0.13 foi removido e a primeira
// assembly carregada SOB DEMANDA passou a falhar com FileNotFoundException
// (System.Runtime.Serialization.Primitives, pedida pela Fido2 em
// AssertionOptions.ToJson), quebrando o login por MFA/FIDO2 (HTTP 400).
//
// O guard e idempotente: so reinicia se /proc/<pid>/maps apontar para arquivos
// removidos do framework. Cobre tambem upgrades de openssl/icu e release apagada.
DPkg::Post-Invoke { "/usr/local/sbin/discovery-runtime-guard || true"; };
